name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK pré-instalado
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Plataformas disponíveis:"
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "Build-tools disponíveis:"
          ls -1 "$ANDROID_HOME/build-tools" || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FinancasDeCasa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
